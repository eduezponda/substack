services:
  backend:
    build: ./backend
    container_name: substack_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
    command: poetry run python manage.py runserver 0.0.0.0:8000

  frontend:
    build: ./frontend
    container_name: substack_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host
